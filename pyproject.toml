[project]
name = "peng"
version = "0.1.0"
description = "鹏🐣 - 大鹏一日同风起，扶摇直上九万里！"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Non-Commercial (see LICENSE file; commercial use requires a separate commercial license)" }
authors = [{ name = "Feng", email = "feng@example.com" }]

dependencies = [
  # 核心依赖
  "zhipuai>=2.1.0",
  "httpx>=0.25.0",
  "aiofiles>=23.0.0",
  "psycopg2-binary>=2.9.0",
  "asyncpg>=0.29.0",
  "pydantic>=2.0.0",
  "python-dotenv>=1.0.0",
  "filelock>=3.12.0",
  "rich>=13.0.0",
  "prompt_toolkit>=3.0.0",
  "textual>=8.0.0",
  "sqlalchemy>=2.0.47",
  "docker>=7.1.0",
  # Web UI 依赖
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "websockets>=12.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.6",                  # 文件上传支持
  "redis>=7.2.1",
  "fakeredis>=2.34.1",
  "top-coder-ai-skills-debugger>=0.1.0",
  "python-consul>=1.1.0",
  "python-lsp-server>=1.14.0",
  "pexpect>=4.9.0; sys_platform != 'win32'",
  "pywinpty>=2.0.0; sys_platform == 'win32'",
  "pillow>=12.2.0",
  "httpcore[asyncio]>=1.0.9",
  "psutil>=5.9.0",
  "pathspec>=0.12.0",
  # 飞书 Channel 依赖
  "lark-oapi>=1.4.0",
  "rapidfuzz>=3.14.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.4.0",
  "pytest-asyncio>=0.21.0",
  "pytest-cov>=4.1.0",
  "pytest-xdist>=3.0.0",
  "ruff>=0.1.0",
  "mypy>=1.0.0",
]

[project.scripts]
fly = "peng.ui.fly:run_fly"
nest = "peng.nest._cli_main:main"
msg = "peng.cli._msg_impl:main"
task = "peng.cli._task_impl:main"
tags = "peng.tags:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

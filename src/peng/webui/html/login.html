<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - {{ agent_name }} Web UI</title>
    <link rel="icon" type="image/svg+xml" href="/static/img/favicon.svg">
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/login.css">
</head>
<body class="dark-theme">
    <!-- 登录页面容器 -->
    <div class="login-page">
        <!-- 登录卡片 -->
        <div class="login-card">
            <!-- 标题区域 -->
            <div class="login-header">
                <span class="login-logo">🪽</span>
                <h1>"{{ agent_name }} - 大鹏一日同风起，扶摇直上九万里！</h1>
                <p class="login-subtitle">欢迎回来，请登录您的账户</p>
            </div>

            <!-- 登录表单 -->
            <form id="login-form" class="login-form" action="/api/login" method="POST">
                <!-- 用户名输入框 -->
                <div class="form-group">
                    <label for="username" class="form-label">用户名</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input 
                            type="text" 
                            id="username" 
                            name="username" 
                            class="form-input" 
                            placeholder="请输入用户名"
                            autocomplete="username"
                            required
                        >
                    </div>
                </div>

                <!-- 密码输入框 -->
                <div class="form-group">
                    <label for="password" class="form-label">密码</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-input" 
                            placeholder="请输入密码"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="password-toggle" id="password-toggle" title="显示/隐藏密码">
                            👁️
                        </button>
                    </div>
                </div>

                <!-- 记住我选项 -->
                <div class="form-options">
                    <label class="checkbox-label remember-me">
                        <input type="checkbox" id="remember-me" name="remember_me">
                        <span>记住我</span>
                    </label>
                    <a href="/forgot-password" class="forgot-link">忘记密码？</a>
                </div>

                <!-- 登录按钮 -->
                <button type="submit" class="btn-login" id="login-btn">
                    <span class="btn-text">登录</span>
                    <span class="btn-loading" style="display: none;">
                        <span class="spinner"></span>
                        登录中...
                    </span>
                </button>
            </form>

            <!-- 注册链接 -->
            <div class="login-footer">
                <p>还没有账户？<a href="/register" class="register-link">立即注册</a></p>
            </div>

            <!-- 错误提示区域 -->
            <div id="login-error" class="error-message" style="display: none;"></div>
        </div>

        <!-- 页面底部 -->
        <footer class="login-page-footer">
            <p>&copy; 2024 {{ agent_name }} 大鹏一日同风起，扶摇直上九万里！. All rights reserved.</p>
        </footer>
    </div>

    <script src="/static/js/login.js"></script>
</body>
</html>

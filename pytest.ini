[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# 默认并行执行 (-n auto)
addopts = -v --tb=short -n auto
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    # 忽略测试函数返回ResultRecord的警告（测试框架设计需要）
    ignore::pytest.PytestReturnNotNoneWarning
    ignore:Test functions should return None:UserWarning

# 覆盖率配置
[coverage:run]
omit =
    src/peng/auth/*
    src/peng/unit_test_rules.py

[coverage:report]
omit =
    src/peng/auth/*
    src/peng/unit_test_rules.py
